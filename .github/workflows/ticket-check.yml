name: Ticket

on:
  schedule:
    - cron: '40 * * * *'   # Every 15 minutes (UTC)
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ticket checker
        id: check_qty
        run: |
          python monitor.py > output.txt 2>&1 || true

          # Extract the three quantities (in order: first, second, third)
          # Assumes the output always has exactly three matching lines in this order
          mapfile -t qtys < <(grep -oP '剩餘數量：\K\d+' output.txt)

          # If we have at least 1 number, use them; otherwise fallback
          qty1=${qtys[0]:-查詢失敗}
          qty2=${qtys[1]:-查詢失敗}
          qty3=${qtys[2]:-查詢失敗}

          # Save them as separate outputs
          echo "qty1=$qty1" >> "$GITHUB_OUTPUT"
          echo "qty2=$qty2" >> "$GITHUB_OUTPUT"
          echo "qty3=$qty3" >> "$GITHUB_OUTPUT"

          # Optional: also save a combined summary
          echo "qty_summary=$qty1 / $qty2 / $qty3" >> "$GITHUB_OUTPUT"

          # Safe full output via base64 (recommended to avoid heredoc bugs)
          full_b64=$(base64 -w 0 output.txt 2>/dev/null || echo "Tm8gb3V0cHV0")
          echo "full_output_b64=$full_b64" >> "$GITHUB_OUTPUT"

      - name: Send Telegram report
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🕒 *庫存報告* (${{ github.event.schedule || '手動觸發' }} UTC)

            第一場 (12:00–13:00) 剩餘：**${{ steps.check_qty.outputs.qty1 }}** 張
            第二場 (13:50–14:50) 剩餘：**${{ steps.check_qty.outputs.qty2 }}** 張
            第三場 (15:40–16:40) 剩餘：**${{ steps.check_qty.outputs.qty3 }}** 張

            總結：${{ steps.check_qty.outputs.qty_summary }}

            完整原始輸出：$(echo "${{ steps.check_qty.outputs.full_output_b64 }}" | base64 -d 2>/dev/null || echo "無法顯示完整內容")
