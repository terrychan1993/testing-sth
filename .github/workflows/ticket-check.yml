name: Ticket

on:
  schedule:
    - cron: '40 * * * *'   # Every 15 minutes (UTC)
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ticket checker
        id: check_qty
        run: |
          python monitor.py > output.txt 2>&1 || true
          qty=$(grep -oP '剩餘數量：\K\d+' output.txt || echo '查詢失敗或無數據')
          echo "qty=$qty" >> $GITHUB_OUTPUT
          echo "full_output<<EOF" >> $GITHUB_OUTPUT
          cat output.txt >> $GITHUB_OUTPUT || echo "No output captured"
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram report
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🕒 *庫存報告* 

            第三場 (15:40–16:40) 剩餘：**${{ steps.check_qty.outputs.qty }}** 張

            完整輸出：${{ steps.check_qty.outputs.full_output }}
