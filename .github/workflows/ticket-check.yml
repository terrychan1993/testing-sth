name: Ticket

on:
  schedule:
    - cron: '40 * * * *'   # Every 15 minutes (UTC)
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ticket checker
        id: check_qty
        run: |
          python monitor.py > output.txt 2>&1 || true

          # Safely extract the first found quantity number (for the main display)
          qty=$(grep -oP '剩餘數量：\K\d+' output.txt | head -1 || echo '查詢失敗或無數據')

          # Write single-line outputs
          echo "qty=$qty" >> "$GITHUB_OUTPUT"

          # Encode full output as base64 to avoid any parsing issues
          if [ -s output.txt ]; then
            full_b64=$(base64 -w 0 output.txt)
          else
            full_b64=$(echo "無輸出內容" | base64 -w 0)
          fi
          echo "full_output_b64=$full_b64" >> "$GITHUB_OUTPUT"
          
      - name: Send Telegram report
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🕒 *庫存報告* 

            第三場 (15:40–16:40) 剩餘：**${{ steps.check_qty.outputs.qty }}** 張

            完整輸出：${{ steps.check_qty.outputs.full_output }}
