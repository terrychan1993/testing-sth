name: Ticket

on:
  schedule:
    - cron: '40 * * * *'   # Every 15 minutes (UTC)
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ticket checker
        id: check_qty
        run: |
          python monitor.py > output.txt 2>&1 || true

          # Extract the three quantities (in order: first, second, third)
          # Assumes the output always has exactly three matching lines in this order
          mapfile -t qtys < <(grep -oP '剩餘數量：\K\d+' output.txt)

          # If we have at least 1 number, use them; otherwise fallback
          qty1A=${qtys[0]:-查詢失敗}
          qty1B=${qtys[1]:-查詢失敗}
          qty1C=${qtys[2]:-查詢失敗}
          qty2A=${qtys[3]:-查詢失敗}
          qty2B=${qtys[4]:-查詢失敗}
          qty2C=${qtys[5]:-查詢失敗}
          qty3A=${qtys[6]:-查詢失敗}
          qty3B=${qtys[7]:-查詢失敗}
          qty4A=${qtys[8]:-查詢失敗}
          qty4B=${qtys[9]:-查詢失敗}
          qty5A=${qtys[10]:-查詢失敗}
          qty5B=${qtys[11]:-查詢失敗}
          qty6A=${qtys[12]:-查詢失敗}
          qty6B=${qtys[13]:-查詢失敗}
          qty7A=${qtys[14]:-查詢失敗}
          qty7B=${qtys[15]:-查詢失敗}
          qty8=${qtys[16]:-查詢失敗}
          qty9=${qtys[17]:-查詢失敗}
          qty10=${qtys[18]:-查詢失敗}

          # Save them as separate outputs
          echo "qty1A=$qty1A" >> "$GITHUB_OUTPUT"
          echo "qty1B=$qty1B" >> "$GITHUB_OUTPUT"
          echo "qty1C=$qty1C" >> "$GITHUB_OUTPUT"
          echo "qty2A=$qty2A" >> "$GITHUB_OUTPUT"
          echo "qty2B=$qty2B" >> "$GITHUB_OUTPUT"
          echo "qty2C=$qty2C" >> "$GITHUB_OUTPUT"
          echo "qty3A=$qty3A" >> "$GITHUB_OUTPUT"
          echo "qty3B=$qty3B" >> "$GITHUB_OUTPUT"
          echo "qty4A=$qty4A" >> "$GITHUB_OUTPUT"
          echo "qty4B=$qty4B" >> "$GITHUB_OUTPUT"
          echo "qty5A=$qty5A" >> "$GITHUB_OUTPUT"
          echo "qty5B=$qty5B" >> "$GITHUB_OUTPUT"
          echo "qty6A=$qty6A" >> "$GITHUB_OUTPUT"
          echo "qty6B=$qty6B" >> "$GITHUB_OUTPUT"
          echo "qty7A=$qty7A" >> "$GITHUB_OUTPUT"
          echo "qty7B=$qty7B" >> "$GITHUB_OUTPUT"
          echo "qty8=$qty8" >> "$GITHUB_OUTPUT"
          echo "qty9=$qty9" >> "$GITHUB_OUTPUT"
          echo "qty10=$qty10" >> "$GITHUB_OUTPUT"
          
      - name: Get current HK time
        id: time
        run: |
          MACAU_TIME=$(TZ='Asia/Macau' date '+%Y-%m-%d %H:%M:%S')
          echo "macau_time=$MACAU_TIME" >> "$GITHUB_OUTPUT"

      - name: Send Telegram report
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🕒 *森日向子庫存報告* (${{ steps.time.outputs.macau_time }})
            攝影會
            第一場：**${{ steps.check_qty.outputs.qty1A }}** 加購券：**${{ steps.check_qty.outputs.qty2A }}**
            第二場：**${{ steps.check_qty.outputs.qty1B }}** 加購券：**${{ steps.check_qty.outputs.qty2B }}**
            第三場：**${{ steps.check_qty.outputs.qty1C }}** 加購券：**${{ steps.check_qty.outputs.qty2C }}**
            見面會入場券
            第一場：**${{ steps.check_qty.outputs.qty3A }}** 第二場：**${{ steps.check_qty.outputs.qty3B }}**
            見面會合照券
            第一場：**${{ steps.check_qty.outputs.qty4A }}** 第二場：**${{ steps.check_qty.outputs.qty4B }}**
            10秒個人攝影券
            第一場：**${{ steps.check_qty.outputs.qty5A }}** 第二場：**${{ steps.check_qty.outputs.qty5B }}**
            10秒自拍券
            第一場：**${{ steps.check_qty.outputs.qty6A }}** 第二場：**${{ steps.check_qty.outputs.qty6B }}**
            簽名券
            第一場：**${{ steps.check_qty.outputs.qty7A }}** 第二場：**${{ steps.check_qty.outputs.qty7B }}**
            15秒Video錄影劵：**${{ steps.check_qty.outputs.qty8 }}**
            唇印簽名劵：**${{ steps.check_qty.outputs.qty9 }}**
            教師挑戰劵：**${{ steps.check_qty.outputs.qty9 }}**
